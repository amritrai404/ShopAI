
# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = alembic

# Use forward slashes for Windows compatibility
prepend_sys_path = .

# Template for migration filenames
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone used in migration filenames
# timezone =

# Maximum length of migration filename slug
# truncate_slug_length = 40

# Run the environment during revision commands
# revision_environment = false

# Detect sourceless migration files
# sourceless = false

# Migration version locations
# version_locations = %(here)s/alembic/versions

# Path separator for version locations
version_path_separator = os

# Recursively search migration directories
# recursive_version_locations = false

# Output encoding for generated migration files
# output_encoding = utf-8

# Database URL is loaded from app.core.config.settings in alembic/env.py.
# Do not hardcode database credentials here.
# sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Optional code formatting hooks can be configured here.


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers = console
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
